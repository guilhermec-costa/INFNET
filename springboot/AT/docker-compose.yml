services:
  postgres:
    image: postgres:16-alpine
    container_name: hospital-postgres
    environment:
      POSTGRES_DB: hospitaldb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hospitaldb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: hospital-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/hospitaldb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      APP_USER: admin
      APP_PASSWORD: admin123
      APP_ADMIN_USER: actuator
      APP_ADMIN_PASSWORD: actuator123
    ports:
      - "8080:8080"

volumes:
  postgres_data:
