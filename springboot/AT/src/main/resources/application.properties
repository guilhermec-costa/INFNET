spring.application.name=hospital-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hospitaldb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,env
management.endpoint.health.show-details=when_authorized

app.security.user.name=${APP_USER:admin}
app.security.user.password=${APP_PASSWORD:admin123}
app.security.admin.name=${APP_ADMIN_USER:actuator}
app.security.admin.password=${APP_ADMIN_PASSWORD:actuator123}
