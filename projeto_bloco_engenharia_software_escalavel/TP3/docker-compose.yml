services:
  notificacoes-service:
    build:
      context: ./notificacoes-service
    ports:
      - "8181:8081"
    volumes:
      - notificacoes-data:/app/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      NOTIFICACOES_SERVICE_URL: http://notificacoes-service:8081
    ports:
      - "8180:8080"
    volumes:
      - biblioteca-data:/app/data
    depends_on:
      - notificacoes-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "4173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  biblioteca-data:
  notificacoes-data:
