spring.application.name=notificacoes-service
server.port=8081

# Ponto de extensão do Spring Cloud Config. Sem URI, a configuração local é usada.
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

spring.datasource.url=jdbc:h2:file:./data/notificacoes;MODE=LEGACY;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
