services:
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: biblioteca
      RABBITMQ_DEFAULT_PASS: biblioteca
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  notificacoes-service:
    build:
      context: ./notificacoes-service
    environment:
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8281:8081"
    volumes:
      - notificacoes-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      NOTIFICACOES_SERVICE_URL: http://notificacoes-service:8081
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8280:8080"
    volumes:
      - biblioteca-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      notificacoes-service:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "4273:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  biblioteca-data:
  notificacoes-data:
  rabbitmq-data:
