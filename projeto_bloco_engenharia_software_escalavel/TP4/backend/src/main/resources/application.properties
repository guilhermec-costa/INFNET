spring.application.name=biblioteca
server.port=8080

# HTTP síncrono somente para consultas do frontend.
notificacoes.service.url=${NOTIFICACOES_SERVICE_URL:http://localhost:8081}

# RabbitMQ e Transactional Outbox para comandos de escrita assíncronos.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:biblioteca}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:biblioteca}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
biblioteca.outbox.fixed-delay=${OUTBOX_FIXED_DELAY:1000}

spring.datasource.url=jdbc:h2:file:./data/biblioteca;MODE=LEGACY;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
