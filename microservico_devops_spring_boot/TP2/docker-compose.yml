services:
  product-service:
    build: ./product-service
    image: eventos/product-service:1.0.0
    container_name: product-service
    ports:
      - "8081:8081"
    networks:
      - eventos-network

  order-service:
    build: ./order-service
    image: eventos/order-service:1.0.0
    container_name: order-service
    depends_on:
      - product-service
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8081
    ports:
      - "8082:8082"
    networks:
      - eventos-network

networks:
  eventos-network:
    name: eventos-network
    driver: bridge
