server:
  port: 8082
spring:
  application:
    name: notification-service
  data:
    mongodb:
      uri: "${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/notification_db}"
eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}"
management:
  endpoints:
    web:
      exposure:
        include: health,info
