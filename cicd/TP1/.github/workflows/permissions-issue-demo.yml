name: Permissions and Issue Demo

on:
  workflow_dispatch:
    inputs:
      trigger_issue:
        type: boolean
        default: false
        description: 'Manually trigger issue creation'

permissions:
  contents: read
  issues: write

jobs:
  check-permissions:
    runs-on: ubuntu-latest
    steps:
      - name: Display token permissions
        run: |
          echo "=== GITHUB_TOKEN Permissions ==="
          echo "Token generated with permissions: contents=read, issues=write"
      
      - name: Create issue on manual trigger
        if: github.event.inputs.trigger_issue == 'true' || github.event.inputs.trigger_issue == true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Issue criado via GitHub Actions',
              body: `Este issue foi criado automaticamente pelo workflow.
              
              **Detalhes:**
              - Ator: ${{ github.actor }}
              - Evento: ${{ github.event_name }}
              - Data: ${{ github.event.inputs.trigger_issue }}
              
              O pipeline foi executado com sucesso!`
            })
      
      - name: Display success message
        run: |
          echo "=== Workflow completed ==="
          echo "Issue creation capability verified"
