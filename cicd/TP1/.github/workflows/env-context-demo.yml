name: Environment Contexts Demo

on:
  workflow_dispatch:

env:
  WORKFLOW_VAR: "workflow-level-variable"
  STAGE: "production"

jobs:
  context-demo:
    runs-on: ubuntu-latest
    env:
      JOB_VAR: "job-level-variable"
      STAGE: "staging"
    steps:
      - name: Display GitHub context
        run: |
          echo "=== GitHub Context ==="
          echo "Actor (who triggered): ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
      
      - name: Display runner context
        run: |
          echo "=== Runner Context ==="
          echo "OS: ${{ runner.os }}"
          echo "Name: ${{ runner.name }}"
      
      - name: Display workflow-level env
        run: |
          echo "=== Workflow-level Environment Variables ==="
          echo "WORKFLOW_VAR: ${{ env.WORKFLOW_VAR }}"
          echo "STAGE (workflow): ${{ env.STAGE }}"
      
      - name: Display job-level env
        run: |
          echo "=== Job-level Environment Variables ==="
          echo "JOB_VAR: ${{ env.JOB_VAR }}"
          echo "STAGE (job): ${{ env.STAGE }}"
      
      - name: Step-level variable (inline)
        run: |
          echo "=== Step-level Environment Variables ==="
          STEP_VAR="step-level-variable"
          STAGE="development"
          echo "STEP_VAR: $STEP_VAR"
          echo "STAGE (step): $STAGE"
      
      - name: Demonstrate scope precedence
        run: |
          echo "=== Scope Precedence Demo ==="
          echo "Workflow STAGE: ${{ env.STAGE }}"
          echo "(Job STAGE overwrites workflow STAGE in previous steps)"
