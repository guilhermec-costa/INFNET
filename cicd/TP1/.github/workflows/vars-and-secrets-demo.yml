name: Variables and Secrets Demo

on:
  workflow_dispatch:

jobs:
  display-vars:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Display non-sensitive variables
        run: |
          echo "=== Repository Variables ==="
          echo "APP_MODE: ${{ vars.APP_MODE }}"
          echo "SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}"
      
      - name: Display sensitive secret
        run: |
          echo "=== Repository Secret (masked) ==="
          echo "PROD_TOKEN: ${{ secrets.PROD_TOKEN }}"
      
      - name: Use secret in protected operation
        if: secrets.PROD_TOKEN != ''
        run: |
          echo "Executing protected operation with PROD_TOKEN..."
          # Simulating sensitive operation
          echo "Secret length: ${{ secrets.PROD_TOKEN }}"
